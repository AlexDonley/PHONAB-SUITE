<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonabulary</title>
    <link rel="stylesheet" href="phonabulary.css">
    <script type="module" src="phonabulary.js" defer></script>
</head>
<body>

    <div class="container">
        <!-- Toggle Switch -->
        <div class="toggle-container" id="menuToggle" role="button" aria-label="Toggle menu">
            <div class="toggle-pill"></div>
            <span class="toggle-label active" id="labelLeft" data-toggle="menuLeftAbcs">ABCs</span>
            <span class="toggle-label" id="labelRight" data-toggle="menuRightPhonics">Phonics</span>
        </div>

        <!-- Menu Section 1 (Shown by default) -->
        <div class="menu-section active" id="menuLeftAbcs">

            <div class="grid-square" id="abcGrid">
            </div>

            <br>

            <div class="toggle-container" id="abcDrillToggle" role="button" aria-label="Toggle menu">
                <div class="toggle-pill"></div>
                <span class="toggle-label active" id="labelDrill" data-toggle="subMenuDrill">Drills</span>
                <span class="toggle-label" id="labelCvcs" data-toggle="subMenuCvcs">CVCs</span>
            </div>
            
            <div class="sub-menu active" id="subMenuDrill">
                <div class="flex-rect" id="drillGrid">

                </div>
            </div>
            <div class="sub-menu" id="subMenuCvcs">
                CVCs
            </div>

            <button id="addToQueueBtn">
                Add to Queue →
            </button>
        </div>

        <!-- Menu Section 2 (Hidden by default) -->
        <div class="menu-section" id="menuRightPhonics">
            <h2>Phonics</h2>
            <div class="flex-rect" id="abcGrid">

            </div>
        </div>

        <div class="queue-bar" id="queueBar">
            <div class="queue drag-container" id="queueDiv" data-shuffled=false>

            </div>
            <div class="flex-rect queue-settings" id="queueSettings">

            </div>
            <div class="queue-actions" id="queueActions">
                <button id="clearQueueBtn">Clear Queue</button>
                <button id="startQueueBtn">Start Queue</button>
            </div>
        </div>
    </div>

    <!-- Canvas Overlay -->
    <div id="flashcardOverlay">
        <canvas id="cardCanvas"></canvas>

        <!-- Top Navigation Controls -->
        <div class="top-bar">
        <div class="progress-pill">
            <span id="counterText">1 / 5</span>
            <div class="progress-track">
            <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

        <button id="closeBtn" class="icon-btn" title="Close (Esc)">
            <i class="fa-solid fa-xmark"></i>
        </button>
        </div>

        <!-- Completion Modal -->
        <div id="finishModal" class="modal-backdrop">
        <div class="modal-box">
            <div class="modal-emoji">🎉</div>
            <h2 class="modal-title">Deck Completed!</h2>
            <p class="modal-text">You have reviewed all flashcards in this set.</p>
            <div class="modal-actions">
            <button id="repeatBtn" class="btn btn-primary">Restart</button>
            <button id="modalExitBtn" class="btn btn-secondary">Close</button>
            </div>
        </div>
        </div>

        <!-- Floating Glass Bottom Toolbar -->
        <div class="bottom-toolbar">
        <button id="prevBtn" class="toolbar-btn">
            <i class="fa-solid fa-chevron-up"></i>
            <span>Prev</span>
        </button>

        <div class="divider"></div>

        <button id="nextBtn" class="toolbar-btn">
            <span>Next</span>
            <i class="fa-solid fa-chevron-down"></i>
        </button>

        <div class="divider"></div>

        <button id="fullscreenBtn" class="toolbar-btn icon-only" title="Toggle Fullscreen">
            <i id="fsIcon" class="fa-solid fa-expand"></i>
        </button>
        </div>
    </div>
</body>
</html>
